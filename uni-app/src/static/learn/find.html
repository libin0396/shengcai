<!doctype html>
<html lang="zh-CN">
<head>
<script src="../site-mode.js"></script>
<link rel="stylesheet" href="../tutorial-mode.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>搜索</title>
<meta name="description" content="说一句你遇到的事，找到一句能直接复制给 AI 的提示词。">
<meta name="theme-color" content="#F3F4F6">
<link rel="manifest" href="/static/learn/manifest.webmanifest">
<link rel="stylesheet" href="learn.css">
<link rel="stylesheet" href="find-search.css">
<link rel="stylesheet" href="find-feedback.css">
</head>
<body>
<main>
  <section class="w ttop">
    <h1 class="h1">搜索</h1>
    <p class="find-intro">搜索站内教程、提示词和案例。</p>
    <form class="fsearch" id="fsearch" role="search" autocomplete="off">
      <label for="fq" class="sr">你遇到了什么事</label>
      <input id="fq" maxlength="40" placeholder="搜索教程或提示词" aria-label="搜索站内教程或提示词" enterkeyhint="search">
      <button class="btn pri sm" type="submit">找</button>
    </form>
    <div class="fchips" id="fchips"></div>
  </section>
  <section class="w sec" id="fres" aria-live="polite"></section>
  <p class="foot w">你输入的内容只在当前设备上匹配，不会上传。</p>
</main>
<script src="../tracking.js"></script>
<script src="learn.js"></script>
<script src="aids-data.js"></script>
<script src="guides-data.js"></script>
<script src="find-cases.js"></script>
<script src="find-search.js"></script>
<script src="find-feedback.js"></script>
<script src="find-page.js"></script>
</body>
</html>
