<!doctype html>
<html lang="zh-CN">
<head>
<script src="../site-mode.js"></script>
<link rel="stylesheet" href="../tutorial-mode.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的 · AI 教程站</title>
<meta name="theme-color" content="#F3F4F6">
<link rel="stylesheet" href="ai-play.css">
<link rel="stylesheet" href="ai-nav.css">
<style>
/* 布局：一列。最上面是 AI 等级卡（小A 在旁边打气），下面依次是徽章、学过的课、跟着做的作品、帮助与说明。 */
.mine{display:flex;flex-direction:column;gap:14px}
.mine h1{font-size:30px}
.lvcard{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--blue),#1F33B8);color:#fff;border-radius:24px;padding:18px 16px 16px;box-shadow:0 18px 40px -26px rgba(43,68,230,.9)}
.lvcard .row1{display:flex;align-items:center;gap:14px}
.lvnum{position:relative;flex:none;width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.lvnum small{font-size:11px;font-weight:800;opacity:.85}.lvnum b{font-size:34px;font-weight:900}
.lvcard .nm{flex:1;min-width:0}.lvcard .nm b{display:block;font-size:22px;font-weight:900}.lvcard .nm span{display:block;font-size:13px;opacity:.9;margin-top:2px}
.lvcard .cheer{position:absolute;right:-8px;top:-6px;width:92px;height:92px;border-radius:50%;border:4px solid rgba(255,255,255,.85);animation:bob 2.6s ease-in-out infinite}
.lvbar{height:12px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:16px}
.lvbar i{display:block;height:100%;width:0;border-radius:6px;background:#fff;transition:width 1s cubic-bezier(.3,1.2,.5,1)}
.lvbar.full i{background:var(--yellow)}
.lvmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:700;opacity:.95}
.lvstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.lvstats div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 8px;text-align:center}
.lvstats b{display:block;font-size:20px;font-weight:900}.lvstats small{display:block;font-size:11px;font-weight:700;opacity:.9}
.lvcard a.go{display:flex;align-items:center;justify-content:center;margin-top:14px;min-height:48px;border-radius:14px;background:#fff;color:var(--blue);font-weight:900;text-decoration:none}
.blk{background:var(--surface);border-radius:20px;padding:14px 16px}
.blk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.blk-h h2{margin:0;font-size:18px;font-weight:900}.blk-h small{font-size:12px;font-weight:700;color:var(--ink2)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);border-radius:16px;padding:12px 6px;text-align:center}
.bdg .ic{width:46px;height:46px;border-radius:14px;background:var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.bdg b{font-size:13px;font-weight:900;line-height:1.3}.bdg small{font-size:11px;font-weight:700;color:var(--ink2)}
.bdg.got .ic{background:var(--yellow);color:var(--on-yellow);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.bdg.got:nth-child(2) .ic{animation-delay:.08s}.bdg.got:nth-child(3) .ic{animation-delay:.16s}.bdg.got:nth-child(4) .ic{animation-delay:.24s}.bdg.got:nth-child(5) .ic{animation-delay:.32s}.bdg.got:nth-child(6) .ic{animation-delay:.4s}
.list{display:flex;flex-direction:column;margin-top:6px}
.li{display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);padding:8px 0;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit}
.li:first-child{border-top:0}
.li .pic{flex:none;width:48px;height:48px;border-radius:12px;overflow:hidden;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:900;font-size:13px}
.li .pic img{display:block;width:100%;height:100%;object-fit:cover}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:15px;font-weight:800}.li .t small{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.li .w{flex:none;font-size:13px;font-weight:800;color:var(--blue)}
.li .w.ok{color:var(--on-yellow);background:var(--yellow);border-radius:8px;padding:2px 8px}
.empty{display:flex;align-items:center;gap:12px;margin-top:10px}
.empty img{flex:none;width:52px;height:52px;border-radius:50%;animation:bob 2.6s ease-in-out infinite}
.empty p{margin:0;font-size:14px;color:var(--ink2);line-height:1.6}
.empty a{flex:none;font-size:14px;font-weight:800;color:var(--blue);text-decoration:none}
.rules{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--ink2);line-height:1.8}
.notice{font-size:12px;color:var(--ink2);line-height:1.7;margin:0}
@media (min-width:900px){.mine{max-width:760px;margin:0 auto}.badges{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="app mine" id="mine">
  <div>
    <div class="sub">记录只存在这台设备上，不用登录</div>
    <h1>我的</h1>
  </div>

  <section class="lvcard" aria-label="我的 AI 等级">
    <img class="cheer" id="cheer" src="" alt="">
    <div class="row1">
      <div class="lvnum"><small>等级</small><b id="lvNum">1</b></div>
      <div class="nm"><b id="lvName"></b><span id="lvNext"></span></div>
    </div>
    <div class="lvbar" id="lvBar"><i id="lvFill"></i></div>
    <div class="lvmeta"><span id="lvXp"></span><span id="lvToday"></span></div>
    <div class="lvstats">
      <div><b id="sStreak">0</b><small>连续天数</small></div>
      <div><b id="sDaily">0</b><small>玩过的期数</small></div>
      <div><b id="sLessons">0</b><small>学完的课</small></div>
    </div>
    <a class="go" id="lvGo" href="meiri-ai.html">去玩今天的每日 AI</a>
  </section>

  <section class="blk">
    <div class="blk-h"><h2>学 AI 徽章</h2><small id="bdgSum"></small></div>
    <div class="badges" id="badges"></div>
  </section>

  <section class="blk">
    <div class="blk-h"><h2>学过的课</h2><a href="xue-ai.html" style="font-size:13px;font-weight:800;color:var(--blue);text-decoration:none">全部课程 ›</a></div>
    <div class="list" id="lessons"></div>
  </section>

  <section class="blk">
    <div class="blk-h"><h2>跟着做的作品</h2><a href="guides.html" style="font-size:13px;font-weight:800;color:var(--blue);text-decoration:none">全部教程 ›</a></div>
    <div class="list" id="made"></div>
  </section>

  <section class="blk">
    <div class="blk-h"><h2>等级怎么涨</h2></div>
    <ul class="rules" id="rules"></ul>
  </section>

  <section class="blk">
    <div class="blk-h"><h2>帮助与反馈</h2></div>
    <div class="list">
      <a class="li" href="find.html"><span class="pic">找</span><span class="t"><b>遇到问题？找用法</b><small>用一句话找到适合的教程或提示词</small></span><span class="w">›</span></a>
      <button class="li" id="feedback" type="button"><span class="pic">问</span><span class="t"><b>意见反馈</b><small>告诉我们哪里还可以做得更好</small></span><span class="w">›</span></button>
    </div>
  </section>

  <p class="notice">学习记录、等级和徽章只保存在这台设备的浏览器里，换手机或清除浏览器数据后不会保留，也不会和小程序同步。网站统计记录匿名浏览器的页面、按钮操作及粗略前台活跃时间，不收集搜索等输入原文，统计记录最多保留约 90 天。自愿提交的意见会供站长查看，约 30 天后删除；请不要填写个人信息。</p>
</main>
<script src="../tracking.js"></script>
<script src="ai-nav.js"></script>
<script src="ai-play.js"></script>
<script src="guides-data.js"></script>
<script src="xue-ai-data.js"></script>
<script src="meiri-ai-data.js"></script>
<script src="zuo-data.js"></script>
<script src="wode.js"></script>
</body>
</html>
