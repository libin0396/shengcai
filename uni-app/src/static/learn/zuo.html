<!doctype html>
<html lang="zh-CN">
<head>
<script src="../site-mode.js"></script>
<link rel="stylesheet" href="../tutorial-mode.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>跟着做 · AI 教程站</title>
<meta name="description" content="跟着小A 和小林、小圆、老周，一步一步把一件事用 AI 做出来。">
<meta name="theme-color" content="#F3F4F6">
<link rel="stylesheet" href="ai-play.css">
<link rel="stylesheet" href="ai-nav.css">
<style>
/* 跟着做：上面两位角色轮流说话；中间玩一玩（每篇玩法不一样）；再看本站实测；最后轮到你去真的 AI 里做。 */
.top .tt{flex:1;min-width:0}
.top h1{font-size:23px}

/* 两位角色 + 一个会换方向的对话气泡 */
.zs{position:relative}
#introStage,#endStage,#stage{min-height:0}
.duo{display:flex;justify-content:space-between;align-items:flex-end;padding:0 2px}
.p{display:flex;flex-direction:column;align-items:center;gap:2px;width:72px}
.p .char{width:64px;height:64px}
.p small{font-size:12px;font-weight:700;color:var(--ink2)}
.p.talk .char{animation:hop .5s cubic-bezier(.3,1.5,.5,1) 1,bob 2.6s ease-in-out .5s infinite}
.zs.ai-happy .p.a .char{animation:jump .7s cubic-bezier(.3,1.4,.5,1) 2,bob 2.6s ease-in-out 1.4s infinite}
.zs.ai-confused .p.a .char{animation:tilt 1.1s ease-in-out infinite}
.zs.ai-happy .p.me .char{animation:hop .55s cubic-bezier(.3,1.5,.5,1) .15s 2,bob 2.6s ease-in-out 1.4s infinite}
.zs .face{display:none}
.zs.ai-flat .face,.zs.ai-confused .face{display:block}
.zs.ai-flat .f.flat,.zs.ai-confused .f.wavy{display:inline}
.zs .p.a.blinking .f.flat{display:none}.zs .p.a.blinking .f.blink{display:inline}
.say{position:relative;margin-top:10px;background:var(--bg);border-radius:16px;padding:10px 14px;font-size:16px;line-height:1.6;min-height:50px;animation:pop .25s cubic-bezier(.3,1.5,.5,1) both}
.say::before{content:"";position:absolute;top:-7px;left:var(--tail,26px);width:14px;height:14px;background:inherit;transform:rotate(45deg);border-radius:3px}
.say.me{background:var(--blue-soft)}
.say.a{--tail:calc(100% - 40px)}
.say b{display:block;font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:1px}

/* 玩一玩的卡片 */
.plays{display:flex;flex-direction:column;gap:12px}
.plays:empty{display:none}
.wg{display:flex;flex-direction:column;gap:10px;animation:rise .3s ease both}
.wh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wk{font-size:12px;font-weight:900;color:var(--on-blue);background:var(--blue);border-radius:8px;padding:2px 9px}
.wt{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg);border-radius:6px;padding:2px 7px}
.wok{margin-left:auto;font-size:12px;font-weight:900;color:var(--blue)}
.wg.done .wk{background:var(--blue-soft);color:var(--blue)}
.wask{margin:0;font-size:16px;font-weight:800;line-height:1.55}
.wb{display:flex;flex-direction:column;gap:10px}
.wcount{font-size:13px;font-weight:800;color:var(--ink2);text-align:center}
.wfb{background:var(--bg);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.6}
.wfb.ok{background:var(--blue-soft)}
.wfb b{display:inline-block;background:var(--blue);color:var(--on-blue);font-size:12px;font-weight:900;border-radius:7px;padding:1px 8px;margin-right:8px}

/* 打码 */
.note{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:15px;line-height:2.1}
.note p{margin:0}
.note .note-h{font-weight:900;line-height:1.6;margin-bottom:4px}
.tok{border:0;background:transparent;color:var(--ink);font-size:15px;font-weight:700;padding:1px 3px;border-radius:6px;box-shadow:inset 0 -2px 0 var(--blue);line-height:1.5}
.tok.hit{background:var(--ink);color:var(--bg);box-shadow:none;animation:stampin .45s cubic-bezier(.2,1.6,.4,1) both}
/* 找茬 */
.ref{background:var(--bg);border-radius:14px;padding:10px 14px}
.ref b{display:block;font-size:12px;font-weight:900;color:var(--ink2);margin-bottom:2px}
.ref p{margin:0;font-size:14px;line-height:1.7}
.spots{display:flex;flex-direction:column;gap:6px}
.spot{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:15px;font-weight:700;line-height:1.5}
.spot.found{border-color:var(--blue);background:var(--blue-soft)}
.spot.found s{color:var(--ink2);font-weight:600;font-size:13px}
.spot .fix{color:var(--blue);animation:pop .3s ease both}
/* 分一分 */
.dots2{display:flex;justify-content:center;gap:6px}
.dots2 i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:transform .2s}
.dots2 i.on{background:var(--blue)}.dots2 i.cur{background:var(--blue);transform:scale(1.35)}
.jcard{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center;font-size:18px;font-weight:800;line-height:1.5;animation:cardin .4s cubic-bezier(.3,1.4,.5,1) both;box-shadow:0 12px 26px -20px var(--shadow)}
.jcard.has-img{padding:8px}
.jimg{display:block;width:100%;border-radius:12px;aspect-ratio:16/9;object-fit:cover}
.jimg.crop-r{aspect-ratio:1/1;object-position:right center}
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bins.three{grid-template-columns:1fr}
.bin{border:2px solid var(--blue);background:var(--surface);color:var(--blue);border-radius:14px;min-height:52px;padding:6px 10px;font-size:16px;font-weight:900}
.bin:active{transform:scale(.97)}
.jsum{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.jsum li{display:flex;justify-content:space-between;gap:10px;background:var(--bg);border-radius:10px;padding:7px 10px;font-size:14px;line-height:1.5}
.jsum b{flex:none;color:var(--blue);font-size:13px}
/* 选一选 */
.opts{display:flex;flex-direction:column;gap:8px}
.opt.wrong{border-color:var(--line);color:var(--ink2);text-decoration:line-through}
.pimgs{display:grid;grid-template-columns:1fr;gap:8px}
.pimgs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pimgs figure{margin:0;display:flex;flex-direction:column;gap:4px}
.pimgs img{display:block;width:100%;border-radius:12px;background:var(--bg)}
.pimgs figcaption{font-size:11px;font-weight:800;color:var(--ink2)}
/* 排顺序 */
.olist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.olist li{display:flex;align-items:flex-start;gap:10px;background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;line-height:1.6;animation:pop .28s cubic-bezier(.3,1.5,.5,1) both}
.olist li b{flex:none;width:24px;height:24px;border-radius:8px;background:var(--blue);color:var(--on-blue);font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opool{display:flex;flex-direction:column;gap:8px}
.obtn{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-height:48px;padding:8px 12px;font-size:15px;font-weight:700;line-height:1.5;text-align:left}
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--bg);border-radius:12px;padding:6px}
.tslot{position:relative;aspect-ratio:9/16;border-radius:8px;border:2px dashed var(--line);overflow:hidden}
.tslot.on{border:0;animation:pop .3s cubic-bezier(.3,1.5,.5,1) both}
.tslot img{display:block;width:100%;height:100%;object-fit:cover}
.tslot b{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:6px;background:var(--surface);color:var(--blue);font-size:12px;display:flex;align-items:center;justify-content:center}
.tpool{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tthumb{border:0;padding:0;background:transparent;border-radius:8px;overflow:hidden;aspect-ratio:9/16}
.tthumb img{display:block;width:100%;height:100%;object-fit:cover}
/* 选词拼 */
.crow{display:flex;flex-direction:column;gap:6px}
.crow>b{font-size:13px;font-weight:900;color:var(--ink2)}
.cops{display:flex;flex-wrap:wrap;gap:8px}
.cop{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-height:44px;padding:6px 12px;font-size:15px;font-weight:700;line-height:1.4;text-align:left}
.cop.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);animation:pop .25s ease both}
.cprev{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.8}
.cprev b{color:var(--blue);animation:pop .3s ease both}
.cprev i{font-style:normal;color:var(--ink2);letter-spacing:1px}
/* 分时间 */
.abar{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px;background:var(--bg)}
.abar span{flex-basis:0;min-width:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--on-blue);background:var(--blue);transition:flex-grow .3s ease;white-space:nowrap;overflow:hidden}
.abar span:nth-child(2){background:var(--blue2)}.abar span:nth-child(3){background:var(--blue3)}.abar span:nth-child(4){background:var(--blue4)}
.abar span.gap{background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 6px,var(--line) 6px,var(--line) 12px);color:transparent}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 44px 74px 44px;align-items:center;gap:8px}
.arow>b{font-size:15px;font-weight:800}
.ab{width:44px;height:44px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:22px;font-weight:800;line-height:1}
.ab:disabled{opacity:.35}
.av{text-align:center;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
/* 放文字（图片上的字和虚线框用固定颜色，不跟深色模式变） */
.ptexts{display:flex;flex-wrap:wrap;gap:8px}
.ptx{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-height:44px;padding:6px 12px;font-size:15px;font-weight:800}
.ptx.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.ptx.done{opacity:.4;text-decoration:line-through}
.pic{position:relative;width:100%;border-radius:12px;overflow:hidden;background:var(--bg)}
.pic>img{display:block;width:100%;height:100%;object-fit:cover}
.zone{position:absolute;border:2px dashed rgba(255,255,255,.95);background:rgba(43,68,230,.14);border-radius:10px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:4px 8px;color:#161A23}
.zone small{font-size:11px;font-weight:800;color:#161A23;background:rgba(255,255,255,.9);border-radius:6px;padding:1px 6px}
.zone .ztext{font-size:12px;font-weight:700;color:#3A4A2E;animation:fly .45s cubic-bezier(.3,1.4,.5,1) both}
.zone .ztext.big{font-size:17px;font-weight:900;color:#2F3D24}
.zone.has{border-color:transparent;background:transparent}
/* 读一遍 */
.tp{background:var(--night);color:rgba(255,255,255,.45);border-radius:14px;padding:14px 16px;font-size:19px;font-weight:800;line-height:1.8}
.tp span.lit{color:#fff;transition:color .2s}
.tclock{text-align:center;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
/* 翻一翻 */
.bpage{margin:0;display:flex;flex-direction:column;gap:6px;animation:flip .45s ease both;transform-origin:left center}
.bpage img{display:block;width:100%;border-radius:12px;background:var(--bg)}
.bpage figcaption{display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.6}
.bpage figcaption b{font-size:12px;color:var(--ink2)}
.bnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* 成片 */
.tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tl figure{margin:0;display:flex;flex-direction:column;gap:4px}
.tl img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px}
.tl figcaption{font-size:11px;line-height:1.35;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:3px 4px;animation:pop .3s ease both}
.export{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--ink2)}
.export span{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.export span i{display:block;height:100%;width:0;background:var(--blue);transition:width 1.1s ease}
.cap{display:block;font-size:12px;color:var(--ink2);line-height:1.5}
.film-holder .film{max-width:236px;margin:4px auto 0}

/* 本站实测 */
.reveal{display:flex;flex-direction:column;gap:12px;animation:rise .35s ease both}
.reveal h3{margin:0;font-size:14px;font-weight:900;color:var(--ink2)}
.media{margin:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.shot{display:block;max-width:100%;border-radius:12px;animation:pop .35s cubic-bezier(.3,1.4,.5,1) both}
.shot.wide{width:100%;height:auto}
.shot.tall{height:260px;width:auto;aspect-ratio:9/16;object-fit:cover}
.media figcaption{display:flex;flex-direction:column;gap:2px}
.mk{display:inline-block;align-self:flex-start;font-size:11px;font-weight:800;color:var(--ink);background:var(--bg);border-radius:6px;padding:1px 6px}
.res{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:14px;padding:12px 14px}
.res-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res-h b{font-size:15px;font-weight:900}
.res .wt{background:var(--surface)}
.res dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px;line-height:1.6}
.res dt{font-weight:800;color:var(--ink2);white-space:nowrap}.res dd{margin:0}
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.frame{aspect-ratio:3/4;border-radius:10px;border:2px dashed var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;text-align:center;font-size:12px;font-weight:800;animation:pop .35s ease both}
.frame i{width:26px;height:26px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-style:normal;display:flex;align-items:center;justify-content:center}

/* 成品示例 / 成片 */
.film{position:relative;display:block;width:100%;border:0;padding:0;border-radius:16px;overflow:hidden;background:var(--night);color:#fff;text-align:left}
.film img,.film video{display:block;width:100%;aspect-ratio:9/16;max-height:420px;object-fit:cover}
.film .lbl{position:absolute;left:10px;top:10px;font-size:12px;font-weight:800;color:#fff;background:rgba(22,26,35,.62);border-radius:8px;padding:2px 8px}
.film .play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);animation:pulse 2s ease-in-out infinite}
.film .play::after{content:"";margin-left:5px;border-left:18px solid #161A23;border-top:11px solid transparent;border-bottom:11px solid transparent}
.teaser{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.teaser .film img{max-height:none}
.teaser .film.still img{aspect-ratio:1/1;object-fit:cover}
.teaser .film .play{width:44px;height:44px;margin:-22px 0 0 -22px}
.teaser .film .play::after{border-left-width:13px;border-top-width:8px;border-bottom-width:8px;margin-left:4px}
.teaser p{margin:0;font-size:14px;line-height:1.6;color:var(--ink2)}
.teaser b{display:block;font-size:16px;color:var(--ink);margin-bottom:2px}

/* 开场的步骤表 */
.need p{margin:4px 0 0;font-size:14px;line-height:1.7;color:var(--ink2)}
.need b,.steps-h b{font-size:16px;font-weight:900}
.steps-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.steps-h small{font-size:12px;font-weight:700;color:var(--ink2)}
.slist{margin:8px 0 0;padding:0;list-style:none}
.slist button{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;padding:6px 0}
.slist li:first-child button{border-top:0}
.slist .n{flex:none;width:28px;height:28px;border-radius:9px;background:var(--blue-soft);color:var(--blue);font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}
.slist .done .n{background:var(--yellow);color:var(--on-yellow)}
.slist .t{flex:1;min-width:0;display:flex;flex-direction:column}
.slist .t b{font-size:15px;font-weight:800}
.slist .t small{font-size:12px;font-weight:700;color:var(--blue)}
.slist .w{flex:none;font-size:13px;color:var(--ink2)}
.proof{font-size:12px;font-weight:700;color:var(--ink2);text-align:center}
.proof b{color:var(--ink)}
.link{display:block;text-align:center;font-size:14px;font-weight:800;color:var(--blue);text-decoration:none;padding:8px}

/* 轮到你了 */
.yours{display:flex;flex-direction:column;gap:10px}
.yours h2{margin:4px 0 0;font-size:19px;font-weight:900}
.card h3{margin:0 0 6px;font-size:14px;font-weight:900;color:var(--ink2)}
.howto{margin:0;font-size:15px;line-height:1.75}
.ptext{font-size:15px;line-height:2;background:var(--bg);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere;white-space:pre-wrap}
.fill{font:inherit;font-size:15px;font-weight:800;color:var(--blue);background:var(--surface);border:1.5px solid var(--blue);border-radius:8px;padding:0 6px;margin:0 2px;height:30px;max-width:100%;vertical-align:1px}
textarea.fill{display:block;width:100%;height:auto;margin:6px 0;padding:6px 8px;line-height:1.6;resize:vertical;border-style:dashed;font-weight:700}
.fill:focus{outline:3px solid var(--blue-soft)}
.ptip{margin:6px 0 10px;font-size:12px;color:var(--ink2)}
.checks{display:flex;flex-direction:column;gap:8px}
.checks button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-size:15px;font-weight:700;line-height:1.5;color:var(--ink);min-height:52px;transition:border-color .2s,background .2s}
.checks .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;font-weight:900}
.checks button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.checks button[aria-pressed="true"] .box{background:var(--blue);border-color:var(--blue);color:var(--on-blue);animation:pop .3s cubic-bezier(.3,1.6,.5,1) both}
.note2{margin:2px 0 0;font-size:13px;line-height:1.6;color:var(--ink2)}

/* 做成了 */
.done-stamp{position:absolute;right:14px;top:-12px;background:var(--yellow);color:var(--on-yellow);font-size:16px;font-weight:900;border-radius:10px;padding:4px 14px;transform:rotate(6deg);animation:stamp .5s cubic-bezier(.2,1.8,.4,1) both;box-shadow:0 8px 18px -10px rgba(22,26,35,.5)}
.made b{display:block;font-size:13px;font-weight:800;color:var(--ink2)}
.made p{margin:2px 0 0;font-size:18px;font-weight:900;line-height:1.5}
.ev h3{margin:0;font-size:16px;font-weight:900;color:var(--ink)}
.ev .tool{font-size:12px;font-weight:800;color:var(--ink2);margin-top:2px}
.ev dl{margin:10px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px;line-height:1.65}
.ev dt{font-weight:800;color:var(--ink2);white-space:nowrap}.ev dd{margin:0}
.vcap{font-size:12px;color:var(--ink2);line-height:1.6;margin-top:6px}
#eVideo h3{color:var(--ink);font-size:16px}
#eVideo>.film{max-width:236px;margin:8px auto 0}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gal figure{flex:none;width:78%;margin:0;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px}
.gal img{display:block;width:100%;border-radius:12px;background:var(--bg)}
.gal figcaption{display:flex;flex-direction:column;gap:2px}
.badge-new{background:var(--surface);border-radius:16px;padding:12px 15px;font-size:15px}
.badge-new b{display:inline-block;background:var(--yellow);color:var(--on-yellow);font-size:13px;font-weight:900;border-radius:8px;padding:2px 10px;margin-right:8px}

:root{--blue2:#1F33B8;--blue3:#5B6CF0;--blue4:#8A97F5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--blue2:#6F7EF0;--blue3:#A9B3FF;--blue4:#C7CDFF}}
:root[data-theme="dark"]{--blue2:#6F7EF0;--blue3:#A9B3FF;--blue4:#C7CDFF}

@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
@keyframes stampin{0%{transform:scale(1.8) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes cardin{from{transform:translateX(40px) rotate(4deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fly{from{transform:translateY(-30px) rotate(-6deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes flip{from{transform:perspective(900px) rotateY(-70deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style>
</head>
<body>
<main class="app">
  <section class="view" id="intro">
    <div class="top">
      <a class="back" id="introBack" href="xue-ai.html" aria-label="回到学 AI"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div class="tt"><div class="sub" id="gCat">跟着做</div><h1 id="gTitle">跟着做</h1></div>
    </div>
    <div class="stage zs ai-flat" id="introStage">
      <div class="duo">
        <div class="p me"><div class="char"><img alt="" width="64" height="64"></div><small></small></div>
        <div class="p a"><div class="char"><img alt="" width="64" height="64"></div><small>小A</small></div>
      </div>
      <div class="say" id="iSay" hidden><b></b><span></span></div>
    </div>
    <div class="teaser" id="teaser" hidden>
      <div id="teaserMedia"></div>
      <p><b id="teaserT"></b><span id="teaserS"></span></p>
    </div>
    <div class="card need"><b>要准备</b><p id="gNeeds"></p></div>
    <div class="card"><div class="steps-h"><b id="gN">一共几步</b><small id="gDone"></small></div><ol class="slist" id="stepList"></ol></div>
    <div class="proof" id="gProof"></div>
    <button class="btn" id="startBtn" type="button">开始第 1 步</button>
    <a class="link" id="fullLink" href="guide.html">看完整图文教程</a>
  </section>

  <section class="view" id="step" hidden>
    <div class="top">
      <button class="back" id="stepBack" type="button" aria-label="回到步骤表"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tt"><div class="sub" id="sNo"></div><h1 id="sTitle"></h1></div>
    </div>
    <div class="prog" id="prog" role="img" aria-label="做到第几步"></div>
    <div class="stage zs ai-flat" id="stage">
      <div class="duo">
        <div class="p me" id="sMe"><div class="char"><img alt="" width="64" height="64"></div><small></small></div>
        <div class="p a" id="sA"><div class="char"><img alt="" width="64" height="64"></div><small>小A</small></div>
      </div>
      <div class="say" id="sSay" hidden aria-live="polite"><b></b><span></span></div>
    </div>
    <div class="plays" id="plays"></div>
    <button class="replay" id="skipPlay" type="button" hidden>跳过练习，直接去做</button>
    <div id="reveal"></div>
    <div class="yours" id="yours" hidden>
      <h2>轮到你了：去真的 AI 里做</h2>
      <div class="card"><h3>怎么做</h3><p class="howto" id="howto"></p></div>
      <div class="card" id="pcard" hidden><h3>提示词</h3><div class="ptext" id="ptext"></div><p class="ptip" id="ptip"></p><button class="btn soft" id="copyBtn" type="button">复制提示词</button></div>
      <div class="card"><h3>做完对照检查，一项一项勾</h3><div class="checks" id="checks"></div><p class="note2" id="note" hidden></p></div>
      <button class="btn" id="doneBtn" type="button" disabled>这一步做完了</button>
    </div>
    <button class="replay" id="replay" type="button" hidden>重玩这一步</button>
  </section>

  <section class="view" id="end" hidden>
    <div class="top">
      <button class="back" id="endBack" type="button" aria-label="回到步骤表"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tt"><div class="sub">跟着做 · 全部做完</div><h1 id="eTitle"></h1></div>
    </div>
    <div class="stage zs ai-happy" id="endStage">
      <span class="done-stamp" id="stamp" hidden>做成了</span>
      <div class="duo">
        <div class="p me"><div class="char"><img alt="" width="64" height="64"></div><small></small></div>
        <div class="p a"><div class="char"><img alt="" width="64" height="64"></div><small>小A</small></div>
      </div>
      <div class="say" id="eSay" hidden><b></b><span></span></div>
    </div>
    <div class="badge-new" id="badgeNew" hidden></div>
    <div class="card made"><b>你做出了</b><p id="eMade"></p></div>
    <div class="card" id="eVideo" hidden></div>
    <div class="card ev" id="eEv" hidden></div>
    <div class="two"><a class="btn soft" id="eFull" href="guide.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">看图文教程</a><a class="btn" id="eHome" href="xue-ai.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">回到学 AI</a></div>
  </section>

  <section class="view" id="missing" hidden>
    <h1>没有找到这篇教程</h1>
    <p class="foot" style="text-align:left">链接可能不完整。回到学 AI，从「跟着做」里重新打开。</p>
    <a class="btn" href="xue-ai.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">回到学 AI</a>
  </section>
</main>
<script src="../tracking.js"></script>
<script src="ai-nav.js"></script>
<script src="ai-play.js"></script>
<script src="guides-data.js"></script>
<script src="xue-ai-data.js"></script>
<script src="zuo-core.js"></script>
<script src="zuo-data.js"></script>
<script src="zuo.js"></script>
</body>
</html>
